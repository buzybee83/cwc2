<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Williams-Sonoma</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Promo Banner -->
    <div class="promo-banner">
        <p>Free Shipping on Orders Over $49</p>
    </div>

    <!-- Header -->
    <header class="header">
        <!-- Top Navigation Bar -->
        <div class="header-top">
            <div class="container">
                <div class="header-top-content">
                    <div class="header-links">
                        <a href="#stores">Find a Store</a>
                        <a href="#customer-service">Customer Service</a>
                        <a href="#gift-registry">Gift Registry</a>
                    </div>
                    <div class="header-actions">
                        <a href="#account">Sign In / Create Account</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Header -->
        <div class="header-main">
            <div class="container">
                <div class="header-main-content">
                    <!-- Logo -->
                    <div class="logo">
                        <h1>WILLIAMS SONOMA</h1>
                    </div>

                    <!-- Search Bar -->
                    <div class="search-bar">
                        <input type="text" placeholder="Search for products...">
                        <button type="button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Header Icons -->
                    <div class="header-icons">
                        <a href="#stores" class="icon-link">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span>STORES</span>
                        </a>
                        <a href="#wishlist" class="icon-link">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span>WISH LIST</span>
                        </a>
                        <a href="#cart" class="icon-link cart">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span class="cart-count">0</span>
                            <span>CART</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Navigation -->
        <nav class="main-nav">
            <div class="container">
                <ul class="nav-list">
                    <li><a href="#new">NEW</a></li>
                    <li><a href="#cookware">COOKWARE</a></li>
                    <li><a href="#cutlery">CUTLERY</a></li>
                    <li><a href="#electrics">ELECTRICS</a></li>
                    <li><a href="#tabletop">TABLETOP</a></li>
                    <li><a href="#food">FOOD</a></li>
                    <li><a href="#outdoor">OUTDOOR</a></li>
                    <li><a href="#sale" class="sale-link">SALE</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Hero Section - Main Banner -->
    <section class="hero-section">
        <div class="hero-banner">
            <img src="images/banner.png" alt="Williams Sonoma Main Banner">
        </div>
    </section>

    <!-- Product Grid Section -->
    <section class="product-grid-section">
        <div class="container-full">
            <div class="product-grid">
                <!-- Large Item - Outdoor Cooking (spans 2 rows, left) -->
                <div class="grid-item large">
                    <img src="images/014.avif" alt="Outdoor Cooking Starts Here">
                </div>

                <!-- Top Right - Espresso Machines -->
                <div class="grid-item">
                    <img src="images/003.avif" alt="Espresso Machines">
                </div>

                <!-- Top Far Right - Grill Prep -->
                <div class="grid-item">
                    <img src="images/016.avif" alt="Shop Grill Prep & Marinate Trays">
                </div>

                <!-- Bottom Middle - Serving Trays -->
                <div class="grid-item">
                    <img src="images/004.avif" alt="Shop Serving Trays">
                </div>

                <!-- Bottom Right - Fieldbar -->
                <div class="grid-item">
                    <img src="images/005.avif" alt="Shop Fieldbar">
                </div>
            </div>
        </div>
    </section>

                embeddedservice_bootstrap.settings.devMode = true;

    				'00DVW000006qha5',
    				'Food_Options1',
    				'https://orgfarm-66ca03de5b.test1.my.pc-rnd.site.com/ESWFoodOptions11781639330066',
    				{
    					scrt2URL: 'https://orgfarm-66ca03de5b.test1.my.pc-rnd.salesforce-scrt.com'
    				}
    			);

    			console.error('Error loading Embedded Messaging: ', err);

    <script type='text/javascript' src='https://orgfarm-66ca03de5b.test1.my.pc-rnd.site.com/ESWFoodOptions11781639330066/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
    <script src="script.js"></script>
</body>
</html>
